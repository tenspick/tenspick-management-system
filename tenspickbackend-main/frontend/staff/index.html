                    <h1 id="topbarPageTitle">Dashboard</h1>
                    <p id="topbarPageSubtitle">Welcome back! Here's your work overview.</p>
                </div>
            </div>

            <div class="topbar-right">

                    <div class="topbar-profile-dropdown" id="profileDropdown" hidden role="menu">

                            <div class="profile-dropdown-avatar" id="dropdownAdminInitial">S</div>
                            <div>
                                <strong id="dropdownAdminName">Staff User</strong>
                                <span id="dropdownAdminEmail">staff@tenspick.org</span>
                            </div>
                        </div>
                        <div class="profile-dropdown-divider"></div>
                        <a href="#/profile" class="profile-dropdown-item" data-route="profile">
                            <svg viewBox="0 0 24 24"><path d="M12 12c2.7 0 4.8-2.1 4.8-4.8S14.7 2.4 12 2.4 7.2 4.5 7.2 7.2 9.3 12 12 12Zm0 2.4c-3.2 0-9.6 1.6-9.6 4.8v2.4h19.2v-2.4c0-3.2-6.4-4.8-9.6-4.8Z"/></svg>
                            My Profile
                        </a>
                        <div class="profile-dropdown-divider"></div>
                        <button type="button" class="profile-dropdown-item profile-dropdown-logout" id="topbarLogout">
                            <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg>

        <!-- PAGE CONTENT -->

            </div>
        </div>

    </main>

    <!-- ENV + Auth guard -->
    <script src="../env.js"></script>
    <script>
        // STAFF PORTAL GUARD: Only allow staff users in
        (function () {
            try {
                const raw = sessionStorage.getItem("tenspick_user");
                const user = raw ? JSON.parse(raw) : null;
                const isAuth = sessionStorage.getItem("tenspick_authenticated");

                if (!user && !isAuth) {
                    window.location.replace("../login.html");
                    return;
                }

                const isStaff = user && (user.isStaff === true || String(user.role || "").toLowerCase() === "staff");
                if (!isStaff) {
                    // Admin trying to access staff portal — redirect to admin
                    window.location.replace("../index.html");
                    return;
                }

                // Force staff flag in session
                user.isStaff = true;
                sessionStorage.setItem("tenspick_user", JSON.stringify(user));
            } catch (e) {
                window.location.replace("../login.html");
            }
        })();
    </script>

    <!-- Supabase -->
    <script src="../assets/js/supabase-client.js"></script>

    <!-- Staff Portal Modules -->
    <script src="../assets/js/layout.js"></script>
    <script src="../assets/js/dashboard.js"></script>
    <script src="../assets/js/staff-my-payments.js"></script>
    <script src="../assets/js/admin-chat.js"></script>
    <script src="../assets/js/profile.js"></script>
    <script src="../assets/js/calendar.js"></script>
    <script src="../assets/js/attendance.js"></script>
    <script src="../assets/js/documents.js"></script>
    <script src="../assets/js/reports.js"></script>

    <!-- Staff Router: blocks admin-only routes -->
    <script>
        (function () {
            // Staff is only allowed these routes (all others are blocked)
            const STAFF_ROUTES = {
                "my-payments": "../pages/staff-my-payments/staff-my-payments.html",
                "admin-chat":  "../pages/admin-chat/admin-chat.html",
                profile:       "../pages/profile/profile.html",
                calendar:      "../pages/calendar/calendar.html",
                attendance:    "../pages/attendance/attendance.html",
                documents:     "../pages/documents/documents.html",
                reports:       "../pages/reports/reports.html"
            };

            const STAFF_BLOCKED = ["dashboard", "leads", "clients", "projects", "tasks", "staff", "client-payments", "staff-payments", "website-content", "settings", "activity-logs"];

            const PAGE_META = {
                "my-payments": { title: "My Payments",         subtitle: "Salary and payments received" },
                "admin-chat":  { title: "Chat with Admin",     subtitle: "Send messages to the admin team" },
                profile:       { title: "My Profile",          subtitle: "View and edit your account" },
                calendar:      { title: "Calendar & Meetings", subtitle: "Your schedule and meetings" },
                attendance:    { title: "Leave & Attendance",  subtitle: "Clock in and manage leaves" },
                documents:     { title: "Documents",           subtitle: "Assigned files and documents" },
                reports:       { title: "Work Reports",        subtitle: "Your performance summary" }
            };

            const PAGE_MODULES = {
                "my-payments": "TenspickMyPayments",
                "admin-chat":  "TenspickAdminChat",
                profile:       "TenspickProfile",
                calendar:      "TenspickCalendar",
                attendance:    "TenspickAttendance",
                documents:     "TenspickDocuments",
                reports:       "TenspickReports"
            };

            let currentRoute = null;
            let navId = 0;

            function normalize(raw) {
                return String(raw || "").replace(/^#\/?/, "").replace(/^\/+/, "").split("?")[0].replace(/\/+$/, "").toLowerCase() || "my-payments";
            }

            function updateMeta(route) {
                const meta = PAGE_META[route] || PAGE_META["my-payments"];
                const h1 = document.querySelector(".topbar-heading h1");
                const p = document.querySelector(".topbar-heading p");
                if (h1) h1.textContent = meta.title;
                if (p) p.textContent = meta.subtitle;
                document.title = "Tenspick Staff | " + meta.title;
            }

            function updateSidebar(route) {
                document.querySelectorAll(".sidebar-menu-item").forEach(function (item) {
                    item.classList.remove("active");
                    const r = normalize(item.getAttribute("href") || "");
                    if (r === route) item.classList.add("active");
                });
            }

            function destroyModule(route) {
                const modName = PAGE_MODULES[route];
                if (!modName) return;
                const mod = window[modName];
                if (mod && typeof mod.destroy === "function") {
                    try { mod.destroy(); } catch (e) {}
                }
            }

            function initModule(route) {
                const modName = PAGE_MODULES[route];
                if (!modName) return;
                const mod = window[modName];
                if (mod && typeof mod.init === "function") {
                    try { mod.init(); } catch (e) { console.error("Module init failed:", route, e); }
                }
            }

            async function navigate(rawRoute, replace) {
                let route = normalize(rawRoute);

                // Block restricted routes
                if (STAFF_BLOCKED.includes(route) || !STAFF_ROUTES[route]) {
                    route = "my-payments";
                }

                const id = ++navId;
                const content = document.getElementById("app-content");
                if (!content) return;

                if (currentRoute && currentRoute !== route) destroyModule(currentRoute);

                content.innerHTML = '<div class="spa-loading"><div class="spa-loading-spinner"></div><span>Loading...</span></div>';

                const hash = "#" + route;
                if (window.location.hash !== hash) {
                    replace ? window.history.replaceState({ route }, "", hash) : window.history.pushState({ route }, "", hash);
                }

                try {
                    const res = await fetch(STAFF_ROUTES[route], { cache: "no-store", headers: { "X-SPA-Request": "1" } });
                    if (!res.ok) throw new Error("HTTP " + res.status);
                    const html = await res.text();
                    if (id !== navId) return;
                    content.innerHTML = html;
                    currentRoute = route;
                    updateMeta(route);
                    updateSidebar(route);
                    initModule(route);
                } catch (err) {
                    if (id !== navId) return;
                    content.innerHTML = '<div class="spa-error"><div class="spa-error-icon">!</div><h2>Unable to load page</h2><p>' + err.message + '</p></div>';
                }
            }

            // Intercept all sidebar clicks
            document.addEventListener("click", function (e) {
                const link = e.target.closest("[data-route]");
                if (!link) return;
                e.preventDefault();
                navigate(link.getAttribute("data-route") || link.getAttribute("href"));
            });

            // Handle browser back/forward
            window.addEventListener("popstate", function () {
                navigate(window.location.hash || "my-payments");
            });

            // Initial load
            document.addEventListener("DOMContentLoaded", function () {
                const initial = normalize(window.location.hash || "my-payments");
                navigate(initial, true);
            });

            window.TenspickStaffRouter = { navigate };
        })();
    </script>
