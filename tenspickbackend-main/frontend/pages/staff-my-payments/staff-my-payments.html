<div class="staff-payments-page" id="staffMyPaymentsPage" style="padding: 20px; max-width: 1000px; margin: 0 auto;">

    <!-- HEADER CARD -->
    <div style="background: linear-gradient(135deg, #1E1B4B, #4B49AC); border-radius: 16px; padding: 26px 30px; color: #fff; box-shadow: 0 8px 30px rgba(75,73,172,0.3); margin-bottom: 24px; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;">
        <div>
            <span style="font-size: 11px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.7; font-weight: 700;">My Earnings</span>
            <h2 id="staffTotalPaid" style="font-size: 36px; font-weight: 800; margin: 8px 0 4px; letter-spacing: 0.5px;">₹0</h2>
            <span style="font-size: 13px; opacity: 0.85;">Total paid so far this year</span>
        </div>
        <div style="display: flex; gap: 14px; flex-wrap: wrap;">
            <div style="background: rgba(255,255,255,0.12); border-radius: 10px; padding: 14px 20px; text-align: center; min-width: 100px;">
                <div id="staffPaymentsCount" style="font-size: 22px; font-weight: 800;">0</div>
                <div style="font-size: 11px; opacity: 0.75; margin-top: 2px;">Payments</div>
            </div>
            <div style="background: rgba(255,255,255,0.12); border-radius: 10px; padding: 14px 20px; text-align: center; min-width: 100px;">
                <div id="staffPendingAmount" style="font-size: 22px; font-weight: 800;">₹0</div>
                <div style="font-size: 11px; opacity: 0.75; margin-top: 2px;">Pending</div>
            </div>
            <div style="background: rgba(255,255,255,0.12); border-radius: 10px; padding: 14px 20px; text-align: center; min-width: 100px;">
                <div id="staffLastPayment" style="font-size: 14px; font-weight: 700;">--</div>
                <div style="font-size: 11px; opacity: 0.75; margin-top: 2px;">Last Payment</div>
            </div>
        </div>
    </div>

    <!-- PAYMENT HISTORY TABLE -->
    <div style="background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); border: 1px solid #E5E7EB;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px;">
            <h3 style="margin: 0; font-size: 16px; font-weight: 700; color: #1F2937; display: flex; align-items: center; gap: 8px;">
                <i class="bi bi-receipt" style="color: #4B49AC;"></i> Payment History
            </h3>
            <select id="staffPaymentYearFilter" style="padding: 7px 12px; border: 1px solid #D1D5DB; border-radius: 6px; font-size: 13px; outline: none; color: #374151;">
                <option value="2026">2026</option>
                <option value="2025">2025</option>
            </select>
        </div>

        <div style="overflow-x: auto;">
            <table style="width: 100%; border-collapse: collapse; font-size: 13px;">
                <thead>
                    <tr style="border-bottom: 2px solid #E5E7EB;">
                        <th style="text-align: left; padding: 10px 12px; color: #6B7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">MONTH</th>
                        <th style="text-align: left; padding: 10px 12px; color: #6B7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">TYPE</th>
                        <th style="text-align: left; padding: 10px 12px; color: #6B7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">AMOUNT</th>
                        <th style="text-align: left; padding: 10px 12px; color: #6B7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">DATE PAID</th>
                        <th style="text-align: left; padding: 10px 12px; color: #6B7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">MODE</th>
                        <th style="text-align: left; padding: 10px 12px; color: #6B7280; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">STATUS</th>
                    </tr>
                </thead>
                <tbody id="staffPaymentsTableBody">
                    <tr><td colspan="6" style="text-align: center; padding: 40px; color: #9CA3AF;">Loading payments...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
