<div class="admin-chat-page" id="adminChatPage" style="height: calc(100vh - 80px); display: flex; flex-direction: column; padding: 20px; max-width: 820px; margin: 0 auto; box-sizing: border-box;">

    <!-- HEADER -->
    <div style="background: #fff; border-radius: 12px; padding: 16px 20px; margin-bottom: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #E5E7EB; display: flex; align-items: center; gap: 14px;">
        <div style="width: 44px; height: 44px; border-radius: 50%; background: linear-gradient(135deg, #4B49AC, #7C79D4); display: flex; align-items: center; justify-content: center; font-size: 20px; color: #fff; font-weight: 800; flex-shrink: 0;">A</div>
        <div>
            <strong style="font-size: 15px; color: #1F2937; display: block;">Tenspick Admin</strong>
            <span id="adminChatStatus" style="font-size: 12px; color: #10B981; display: flex; align-items: center; gap: 4px;">
                <span style="width: 7px; height: 7px; background: #10B981; border-radius: 50%; display: inline-block;"></span>
                Online
            </span>
        </div>
        <div style="margin-left: auto; font-size: 12px; color: #9CA3AF; font-style: italic;">Messages are visible to admin only</div>
    </div>

    <!-- MESSAGES AREA -->
    <div id="adminChatMessages" style="flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding: 4px 0; margin-bottom: 16px; min-height: 0;">
        <!-- Messages rendered by JS -->
    </div>

    <!-- INPUT AREA -->
    <div style="background: #fff; border-radius: 12px; padding: 14px 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #E5E7EB;">
        <div style="display: flex; gap: 10px; align-items: flex-end;">
            <textarea id="adminChatInput" placeholder="Type your message to admin..." rows="2" style="flex: 1; padding: 10px 14px; border: 1px solid #D1D5DB; border-radius: 8px; font-size: 13px; outline: none; resize: none; font-family: inherit; line-height: 1.5; transition: border-color 0.2s;"></textarea>
            <button id="adminChatSendBtn" type="button" style="background: #4B49AC; color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-size: 13px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; white-space: nowrap; height: 40px; transition: background 0.2s;">
                <i class="bi bi-send-fill"></i> Send
            </button>
        </div>
    </div>
</div>
